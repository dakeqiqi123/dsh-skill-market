name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: syntax + smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          for file in lib/*.js tools/*.js; do
            node --check "$file"
          done

      - name: Smoke tests
        run: node test/smoke.js

      - name: Rename tests
        run: node test/rename.js

      - name: Client render tests
        run: node test/client-render.js
